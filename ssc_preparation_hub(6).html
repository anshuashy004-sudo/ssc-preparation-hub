<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSC Preparation Hub</title>
<style>
:root{--navy:#142a4e;--blue:#3569d4;--mint:#e8f7f1;--paper:#f5f7fb;--ink:#18243a;--muted:#65718a;--white:#fff;--gold:#f3bd48}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink)}header{background:linear-gradient(125deg,#142a4e,#2d5ea9);color:white;padding:26px 18px}header .wrap,main{max-width:980px;margin:auto}header h1{margin:0;font-size:1.8rem}header p{margin:8px 0 0;opacity:.9}.wrap{padding:0 16px}.topnav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.navbtn,.btn{border:0;border-radius:12px;padding:11px 15px;background:white;color:var(--navy);font-weight:700;cursor:pointer}.navbtn.active,.btn.primary{background:var(--blue);color:white}.btn{background:#eaf0fb;margin:4px}.panel{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #20365c0d}.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.subject{border:1px solid #e3e9f4;background:#fff;border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:.15s}.subject:hover{transform:translateY(-2px);box-shadow:0 6px 18px #243e6615}.subject .emoji{font-size:1.8rem}.subject h3{margin:8px 0 3px}.subject p{color:var(--muted);font-size:.9rem;margin:0}.sectionTitle{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}.small{color:var(--muted);font-size:.9rem}.topicrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.topicbtn{background:#f0f3f9;border:1px solid #e1e7f0;padding:9px 12px;border-radius:999px;cursor:pointer}.topicbtn.active{background:#dfeaff;border-color:#8fb0f0;color:#163e83;font-weight:700}.question{font-size:1.1rem;font-weight:700;margin:16px 0}.option{display:block;width:100%;text-align:left;padding:12px;margin:8px 0;border:1px solid #dfe6ef;background:#fff;border-radius:12px;cursor:pointer}.option.selected{border-color:var(--blue);background:#edf3ff}.option.correct{border-color:#2c9b65;background:#e9f8f0}.option.wrong{border-color:#d45959;background:#fff0f0}.result{background:var(--mint);border-radius:14px;padding:14px;margin-top:12px}.hidden{display:none}input{padding:11px;border:1px solid #ccd5e2;border-radius:10px;font-size:1rem;width:min(100%,340px)}footer{text-align:center;padding:25px;color:var(--muted)}@media(max-width:500px){header h1{font-size:1.5rem}.panel{padding:14px}.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}.subject{padding:12px}}
</style></head>
<body>
<header><div class="wrap"><h1>📚 SSC Preparation Hub</h1><p>Learn by subject · Practice by topic · Track your progress</p></div></header>
<main class="wrap">
<div class="topnav"><button class="navbtn active" onclick="showView('home',this)">🏠 Home</button><button class="navbtn" onclick="showView('history',this)">📊 My Attempts</button></div>
<section id="homeView">
<div class="panel"><h2>Choose a Subject</h2><p class="small">Select a subject to view topics and start your quiz.</p><div class="subjects" id="subjectGrid"></div></div>
<div class="panel hidden" id="subjectPanel"><div class="sectionTitle"><h2 id="subjectHeading">Subject</h2><button class="btn" onclick="backSubjects()">← All subjects</button></div><p class="small" id="subjectDesc"></p><div class="topicrow" id="topicButtons"></div><div id="quizArea"></div></div>
</section>
<section id="historyView" class="hidden"><div class="panel"><h2>📊 My Quiz Attempts</h2><p class="small">Attempt history is stored on this device/browser.</p><div id="historyList"></div><button class="btn" onclick="clearHistory()">Clear history</button></div></section>
</main><footer>SSC Preparation Hub · Keep learning, keep improving ✨</footer>
<script>
const subjects=[
 {id:'gk',name:'General Knowledge',icon:'🌍',desc:'History, Geography, Polity, Economy and Static GK',topics:['History','Geography','Polity','Economy','Static GK'],qs:{'History':[{q:'Who founded the Maurya Empire?',o:['Ashoka','Chandragupta Maurya','Bindusara','Harsha'],a:1},{q:'The Battle of Plassey was fought in which year?',o:['1764','1757','1857','1748'],a:1}],'Geography':[{q:'Which is the longest river entirely within India?',o:['Ganga','Godavari','Narmada','Krishna'],a:1},{q:'The Tropic of Cancer passes through how many Indian states?',o:['6','7','8','9'],a:2}],'Polity':[{q:'Which Article guarantees equality before law?',o:['Article 12','Article 14','Article 19','Article 21'],a:1},{q:'Fundamental Duties are mentioned in which part?',o:['Part III','Part IV','Part IVA','Part V'],a:2}],'Economy':[{q:'GDP measures the value of:',o:['Intermediate goods only','Final goods and services produced domestically','Imports only','Government revenue only'],a:1},{q:'The Reserve Bank of India was established in:',o:['1930','1935','1947','1950'],a:1}],'Static GK':[{q:'The national aquatic animal of India is the:',o:['Blue whale','Ganges river dolphin','Crocodile','Sea turtle'],a:1},{q:'Which is the largest Indian state by area?',o:['Madhya Pradesh','Maharashtra','Rajasthan','Uttar Pradesh'],a:2}] }},
 {id:'science',name:'General Science',icon:'🔬',desc:'Physics, Chemistry and Biology basics',topics:['Physics','Chemistry','Biology'],qs:{'Physics':[{q:'SI unit of electric current is:',o:['Volt','Ohm','Ampere','Watt'],a:2},{q:'Which lens is used to correct myopia?',o:['Convex','Concave','Cylindrical only','Bifocal only'],a:1}],'Chemistry':[{q:'The chemical symbol for sodium is:',o:['So','S','Na','N'],a:2},{q:'A solution with pH 7 at 25°C is:',o:['Acidic','Basic','Neutral','Salty'],a:2}],'Biology':[{q:'Which organelle is known as the powerhouse of the cell?',o:['Ribosome','Mitochondrion','Golgi body','Nucleus'],a:1},{q:'Which vitamin is produced in skin on sunlight exposure?',o:['Vitamin A','Vitamin B12','Vitamin C','Vitamin D'],a:3}]}},
 {id:'maths',name:'Mathematics',icon:'➗',desc:'Arithmetic, algebra, geometry and practice',topics:['Arithmetic','Algebra','Geometry'],qs:{'Arithmetic':[{q:'25% of 360 is:',o:['80','90','100','120'],a:1},{q:'A number is increased by 20% to become 240. Original number?',o:['180','190','200','220'],a:2}],'Algebra':[{q:'If 3x + 5 = 20, then x =',o:['3','5','7','15'],a:1},{q:'The sum of roots of x² − 7x + 10 = 0 is:',o:['10','7','−7','−10'],a:1}],'Geometry':[{q:'Sum of interior angles of a triangle is:',o:['90°','180°','270°','360°'],a:1},{q:'Area of a circle with radius r equals:',o:['2πr','πr²','πd','r²'],a:1}]}},
 {id:'reason',name:'Reasoning',icon:'🧠',desc:'Analogy, series, coding, logic and puzzles',topics:['Series','Analogy','Coding-Decoding'],qs:{'Series':[{q:'Find the next number: 2, 6, 12, 20, 30, ?',o:['36','40','42','44'],a:2},{q:'Find the next letter: A, C, F, J, O, ?',o:['S','T','U','V'],a:2}],'Analogy':[{q:'Book : Read :: Food : ?',o:['Cook','Eat','Buy','Serve'],a:1},{q:'Bird : Nest :: Bee : ?',o:['Web','Den','Hive','Hole'],a:2}],'Coding-Decoding':[{q:'If CAT is coded as DBU, then DOG is coded as:',o:['EPH','CNG','EOG','FPH'],a:0},{q:'If each letter shifts +1, then SUN becomes:',o:['RTM','TVO','TVN','SVN'],a:1}]}},
 {id:'english',name:'English',icon:'🔤',desc:'Vocabulary, grammar and comprehension practice',topics:['Vocabulary','Grammar'],qs:{'Vocabulary':[{q:'Choose the synonym of “Abundant”.',o:['Scarce','Plentiful','Tiny','Empty'],a:1},{q:'Choose the antonym of “Ancient”.',o:['Old','Historic','Modern','Past'],a:2}],'Grammar':[{q:'Choose the correct sentence.',o:['She go to school daily.','She goes to school daily.','She going school daily.','She gone school daily.'],a:1},{q:'Identify the noun: “Honesty is the best policy.”',o:['Best','Is','Honesty','The'],a:2}]}},
 {id:'current',name:'Current Affairs',icon:'📰',desc:'Practice key events and revise news-based facts',topics:['National','International'],qs:{'National':[{q:'Current Affairs quizzes should be updated regularly. Which source is best for verifying official government schemes?',o:['Official ministry website','Random social post','Unverified forwarded message','Anonymous comment'],a:0},{q:'When preparing current-affairs notes, what should you record?',o:['Only headlines','Date, event and verified key facts','Rumours','Opinions without sources'],a:1}],'International':[{q:'Which organization publishes the Human Development Report?',o:['WHO','UNDP','UNESCO','ILO'],a:1},{q:'The headquarters of the United Nations is in:',o:['Geneva','Paris','New York City','Vienna'],a:2}]}}
];
let current=null,topic=null,idx=0,answers=[],submitted=false;
function renderSubjects(){document.getElementById('subjectGrid').innerHTML=subjects.map(s=>`<button class="subject" onclick="openSubject('${s.id}')"><div class="emoji">${s.icon}</div><h3>${s.name}</h3><p>${s.topics.length} practice sections</p></button>`).join('')}
function openSubject(id){current=subjects.find(s=>s.id===id);document.getElementById('subjectPanel').classList.remove('hidden');document.getElementById('subjectHeading').textContent=current.icon+' '+current.name;document.getElementById('subjectDesc').textContent=current.desc;document.getElementById('topicButtons').innerHTML=current.topics.map(t=>`<button class="topicbtn" onclick="startTopic('${t}')">${t}</button>`).join('');document.getElementById('quizArea').innerHTML='';document.getElementById('subjectPanel').scrollIntoView({behavior:'smooth'});}
function backSubjects(){document.getElementById('subjectPanel').classList.add('hidden');current=null}
function startTopic(t){topic=t;idx=0;answers=[];submitted=false;document.querySelectorAll('.topicbtn').forEach(b=>b.classList.toggle('active',b.textContent===t));renderQuestion()}
function renderQuestion(){const qs=current.qs[topic];const area=document.getElementById('quizArea');if(idx>=qs.length){showSummary();return}const q=qs[idx];area.innerHTML=`<div class="panel"><div class="small">Question ${idx+1} of ${qs.length}</div><div class="question">${q.q}</div>${q.o.map((opt,i)=>`<button class="option ${answers[idx]===i?'selected':''}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`).join('')}<div><button class="btn" onclick="prevQ()" ${idx===0?'disabled':''}>← Previous</button><button class="btn primary" onclick="nextQ()">${idx===qs.length-1?'Finish':'Next →'}</button></div></div>`}
function pick(i){answers[idx]=i;renderQuestion()}
function prevQ(){if(idx>0){idx--;renderQuestion()}}
function nextQ(){if(answers[idx]===undefined){alert('Please select an answer first.');return}idx++;renderQuestion()}
function showSummary(){const qs=current.qs[topic];let score=qs.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);let pct=Math.round(score/qs.length*100);let attempt={subject:current.name,topic,score,total:qs.length,pct,date:new Date().toLocaleString()};let h=JSON.parse(localStorage.getItem('sscAttempts')||'[]');h.unshift(attempt);localStorage.setItem('sscAttempts',JSON.stringify(h.slice(0,50)));let area=document.getElementById('quizArea');area.innerHTML=`<div class="result"><h2>Quiz Completed 🎉</h2><p><b>${score} / ${qs.length}</b> correct · <b>${pct}%</b></p><p>${pct>=80?'Excellent work! Keep it up.':pct>=50?'Good effort—revise and try again.':'Keep practicing; you can improve with revision.'}</p><button class="btn primary" onclick="shareResult('${current.name}','${topic}',${score},${qs.length},${pct})">Share result to Telegram</button><button class="btn" onclick="startTopic('${topic}')">Retry quiz</button></div><div class="panel"><h3>Answer review</h3>${qs.map((q,i)=>`<p><b>Q${i+1}. ${q.q}</b><br>Your answer: ${answers[i]===undefined?'Not answered':q.o[answers[i]]}<br>Correct answer: ${q.o[q.a]} ${answers[i]===q.a?'✅':'❌'}</p>`).join('')}</div>`}
function shareResult(subj,t,sc,total,pct){const text=`📚 SSC Preparation Hub Quiz Result\nSubject: ${subj}\nTopic: ${t}\nScore: ${sc}/${total}\nPercentage: ${pct}%\nKeep learning and improving!`;window.open('https://t.me/share/url?url='+encodeURIComponent('')+'&text='+encodeURIComponent(text),'_blank')}
function showView(view,btn){document.getElementById('homeView').classList.toggle('hidden',view!=='home');document.getElementById('historyView').classList.toggle('hidden',view!=='history');document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(view==='history')renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem('sscAttempts')||'[]');document.getElementById('historyList').innerHTML=h.length?h.map(a=>`<div class="panel"><b>${a.subject} · ${a.topic}</b><p>${a.score}/${a.total} (${a.pct}%)</p><span class="small">${a.date}</span></div>`).join(''):'No attempts yet. Try a quiz first!'}
function clearHistory(){if(confirm('Clear saved attempt history on this device?')){localStorage.removeItem('sscAttempts');renderHistory()}}
renderSubjects();
</script></body></html>
